{{- /* 笔记正文之后：这篇笔记在所属那本书里的局部邻域（1 跳） */ -}}
{{- if and .IsPage (ne .Section "") .File -}}
{{- $slug := .File.ContentBaseName -}}
<section class="kb-neighbors">
  <h2>这篇笔记在知识地图中的位置</h2>
  <div class="kb-graph"
       data-graph="{{ printf "%sgraph.json" .CurrentSection.RelPermalink | relURL }}"
       data-mode="focus"
       data-focus="{{ $slug }}"
       data-depth="1"
       data-height="380">
    <div class="kb-graph__bar">
      <label class="kb-search">
        <input type="search" placeholder="在邻域里搜索…" aria-label="搜索邻域节点">
      </label>
      <div class="kb-zoom" role="group" aria-label="缩放地图">
        <button type="button" class="kb-zoom-out" title="缩小">−</button>
        <button type="button" class="kb-zoom-fit" title="适应全局">全局</button>
        <button type="button" class="kb-zoom-in" title="放大">＋</button>
      </div>
      <button type="button" class="kb-reset">复位</button>
      <button type="button" class="kb-lock" aria-pressed="false" title="锁定后可用手指拖动地图；解锁后页面可正常上下滑动">锁定地图</button>
    </div>
    <div class="kb-graph__stage">
      <canvas role="img" aria-label="这篇笔记及其相邻笔记、标签的关系图"></canvas>
      <div class="kb-tip" hidden></div>
    </div>
    <div class="kb-graph__foot">
      <div class="kb-legend">
        <span><i class="kb-dot"></i>笔记</span>
        <span><i class="kb-dot kb-dot--tag"></i>标签</span>
        <span>滚轮缩放 · 拖节点固定</span>
      </div>
      <span class="kb-status">正在加载…</span>
    </div>
  </div>
</section>
{{- end -}}
