# 示例（去掉行首的 # 即可生效）：
# - name: "某某实验室"
#   url: "https://example.com"
#   icon: "https://example.com/logo.png"
#   note: "一起做散热结构优化"
#
# 现在为空：首页底部会显示「暂无合作伙伴」，填入第一条后自动变成图标墙。
