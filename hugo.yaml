baseURL: https://ice917.github.io/
locale: zh-cn
title: 知识地图
theme: PaperMod

# 启用 emoji 支持
enableEmoji: true

# 启用 robots.txt
enableRobotsTXT: true

# 每页显示的文章数
pagination:
  pagerSize: 10

# 语言设置
languages:
  zh:
    label: "中文"
    weight: 1

# PaperMod 主题配置
params:
  # 基础信息
  author: "ice"
  description: "以地图展开的个人知识学习库"

  # 双主题：默认跟随系统，右上角按钮可手动切换（localStorage: pref-theme）
  defaultTheme: auto

  # 显示设置
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true

  # 「书」= 顶级 section。PaperMod 的归档页与首页列表都按 mainSections 取页面，
  # 不写的话 Hugo 会回落到「页面数最多的顶级 section」，另一本书就进不了归档。
  mainSections:
    - notes
    - spatial-mcp

  # 首页由 layouts/index.html 接管（知识地图），不使用 Profile 模式
  profileMode:
    enabled: false

  # 社交图标
  socialIcons:
    - name: github
      url: "https://github.com/ice917"
      title: "访问我的 GitHub"
    - name: email
      url: "mailto:your@email.com"
      title: "发送邮件给我"

# 菜单配置
# 「书架」不在菜单里：书架是站点的外层壳（首页），站名「知识地图」即返回书架的入口，
# 导航只保留书内部（笔记/标签/归档/搜索/历史/关于），这些只在点开一本书之后出现。
menu:
  main:
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 40
    - identifier: search
      name: 搜索
      url: /search/
      weight: 50
    - identifier: history
      name: 历史
      url: /history/
      weight: 55
    - identifier: about
      name: 关于
      url: /about/
      weight: 60

# Markdown：把 LaTeX 公式原样交给渲染钩子（见 layouts/_markup/render-passthrough.html）
# 公式在构建期由 Hugo 用 KaTeX 转成 MathML，浏览器端不需要任何 JS/CSS/字体
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
          inline:
            - ["\\(", "\\)"]

# 自定义输出格式：知识地图的图数据（构建期从内容生成，单一事实源）
outputFormats:
  Graph:
    mediaType: application/json
    baseName: graph
    isPlainText: true
    notAlternative: true

# 输出格式
# 每本书是 content/ 下的一个顶级 section，各自生成 <book>/graph.json，
# 因此 Graph 挂在 section 上，而不是站点首页。
outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
    - Graph
